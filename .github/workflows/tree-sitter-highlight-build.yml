# https://github.com/napi-rs/package-template-pnpm/blob/main/.github/workflows/CI.yml
name: build-tree-sitter-highlight
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tree-sitter-highlight-build.yml"
      - "packages/tree-sitter-highlight/**"
      - "!packages/tree-sitter-highlight/**/*.md"
      - "!packages/tree-sitter-highlight/LICENSE"
      - "!packages/tree-sitter-highlight/**/*.gitignore"
      - "!packages/tree-sitter-highlight/.editorconfig"
      - "!packages/tree-sitter-highlight/docs/**"
  pull_request:
    paths:
      - ".github/workflows/tree-sitter-highlight-build.yml"
      - "packages/tree-sitter-highlight/**"
      - "!packages/tree-sitter-highlight/**/*.md"
      - "!packages/tree-sitter-highlight/LICENSE"
      - "!packages/tree-sitter-highlight/**/*.gitignore"
      - "!packages/tree-sitter-highlight/.editorconfig"
      - "!packages/tree-sitter-highlight/docs/**"

env:
  DEBUG: napi:*
  APP_NAME: tree-sitter-highlight
  CARGO_INCREMENTAL: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build-release --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build-release --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build-release --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build-release --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: pnpm build-release --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-linux-android
            build: pnpm build-release --target aarch64-linux-android
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build-release --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: wasm32-wasip1-threads
            build: pnpm build-release --target wasm32-wasip1-threads
    name: stable - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          git submodule update --init --recursive packages/tree-sitter-highlight
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: |
          rustup target add ${{ matrix.settings.target }}
      - uses: bytecodealliance/setup-wasi-sdk-action@main
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        with:
          add-to-path: false
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            packages/tree-sitter-highlight/target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: ${{ matrix.settings.build }}
        working-directory: packages/tree-sitter-highlight
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "packages/tree-sitter-highlight/*.node"
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "packages/tree-sitter-highlight/*.wasm"
          if-no-files-found: error
